plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    // Only for the opt-in performance mods below (never bundled, never in a normal build).
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "jjk" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "jjk-test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Performance mods for local runs only: ./gradlew runClient -Pperf (or runClientGameTest -Pperf). Off by default, so
    // the shared build and its gametests run exactly as before; never part of the mod's jar.
    if (project.hasProperty('perf')) {
        runtimeOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
        runtimeOnly "maven.modrinth:lithium:mc26.3-0.26.2-fabric"
        runtimeOnly "maven.modrinth:ferrite-core:9.0.0-fabric"
        runtimeOnly "maven.modrinth:immediatelyfast:1.17.1+26.3-fabric"
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test { useJUnitPlatform() }

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

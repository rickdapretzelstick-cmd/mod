# Builds the R6 converter as a Windows app (JJKConverter.exe, tools/exe/) whenever the converter changes and checks it
# runs (tools/app_selftest.py inside the built app, and the window opens). The zip is the run's JJKConverter-windows
# artifact (Actions tab, the run, Artifacts).
name: converter-app

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/converter-app.yml'
  workflow_dispatch:

concurrency:
  group: converter-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=2.0" "scipy>=1.13" "opencv-python>=4.10" "pillow>=10.0" pyinstaller
      - name: Part network where the converter looks for it
        shell: bash
        run: mkdir -p build/synth && cp tools/models/partnet2.pt build/synth/partnet2.pt
      - name: Build the app
        run: python tools/exe/build_exe.py
      - name: Self-test inside the built app
        working-directory: build/app/JJKConverter
        run: |
          .\jjk_worker.exe tools\app_selftest.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The window opens
        working-directory: build/app/JJKConverter
        run: |
          $p = Start-Process .\JJKConverter.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "JJKConverter.exe exited with $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: JJKConverter-windows
          path: build/JJKConverter-windows.zip
          compression-level: 0
